name: ci

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore: ["**/*.md"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix: { platform: [ubuntu-latest, macos-latest] }
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with: { experimental: true }
      - run: just ci
